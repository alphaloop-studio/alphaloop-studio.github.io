<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b0c">
  <title>EMBERCROWN — Art Pass 0.3.2</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0c;color:#e8dcc1;font-family:Georgia,"Noto Serif KR",serif}body{display:grid;place-items:center;padding:24px}.loader{width:min(420px,100%);text-align:center}.mark{width:60px;height:60px;margin:0 auto 24px;position:relative}.mark i{position:absolute;bottom:5px;width:13px;height:42px;background:linear-gradient(#f5cc72,#7e4d1d);clip-path:polygon(50% 0,100% 100%,0 100%)}.mark i:nth-child(1){left:2px;transform:rotate(-18deg)}.mark i:nth-child(2){left:23px;height:54px}.mark i:nth-child(3){right:2px;transform:rotate(18deg)}h1{margin:0;color:#e9d6a4;font-size:clamp(30px,9vw,52px);letter-spacing:.04em}p{margin:12px 0 20px;color:#9f9785;font:600 13px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.track{height:3px;background:#201d17;overflow:hidden}.bar{display:block;width:20%;height:100%;background:#c49b4e;animation:load 1.1s ease-in-out infinite alternate}.detail{display:block;margin-top:12px;color:#6f6b61;font:600 11px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.error{color:#e8b3a5}.retry{display:none;width:100%;height:48px;margin-top:18px;border:1px solid #d2b56e;background:#9c7333;color:#0b0b08;font-weight:900}.retry.show{display:block}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(500%)}}
  </style>
</head>
<body>
  <main class="loader" aria-live="polite">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>EMBERCROWN</h1>
    <p id="message">방향과 서약의 흐름을 바로잡는 중입니다.</p>
    <div class="track"><span class="bar"></span></div>
    <small id="detail" class="detail">Art Pass 0.3.2 · 조작·진행 수정판</small>
    <button id="retry" class="retry" type="button">다시 불러오기</button>
  </main>
  <script>
  (() => {
    "use strict";
    const expectedSha = '10784ec8783d0c604e40b3bbf3f61ef9e95dfc4a1c7c7d6ba601f6ddbb30b441';
    const chunkCount = 7;
    const message = document.getElementById("message");
    const detail = document.getElementById("detail");
    const retry = document.getElementById("retry");
    retry.addEventListener("click", () => location.reload());
    const fail = (error) => {
      console.error(error);
      message.textContent = "불씨를 복원하지 못했습니다.";
      message.classList.add("error");
      detail.textContent = error && error.message ? error.message : String(error);
      retry.classList.add("show");
    };
    const hex = buffer => Array.from(new Uint8Array(buffer), value => value.toString(16).padStart(2,"0")).join("");
    (async () => {
      if (!("DecompressionStream" in self)) throw new Error("최신 Safari 또는 Chrome이 필요합니다.");
      if (!crypto || !crypto.subtle) throw new Error("브라우저 무결성 검사를 사용할 수 없습니다.");
      const files = Array.from({ length: chunkCount }, (_, index) => `./payload/p${String(index).padStart(2, "0")}.txt`);
      const parts = await Promise.all(files.map(async file => {
        const response = await fetch(file, { cache: "no-store" });
        if (!response.ok) throw new Error(`${file} 응답 오류: HTTP ${response.status}`);
        return (await response.text()).trim();
      }));
      detail.textContent = "게임 코드를 해제하고 검증하는 중";
      const compressed = Uint8Array.from(atob(parts.join("")), character => character.charCodeAt(0));
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
      const html = await new Response(stream).text();
      const digest = hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(html)));
      if (digest !== expectedSha || !html.includes("Art Pass 0.3.2") || !html.includes("function movementBasis()") || !html.includes("createInitialWights();")) {
        throw new Error("복원된 수정판의 무결성 검사가 실패했습니다.");
      }
      document.open();
      document.write(html);
      document.close();
    })().catch(fail);
  })();
  </script>
</body>
</html>
