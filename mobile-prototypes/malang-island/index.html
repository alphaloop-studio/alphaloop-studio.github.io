<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#dff8f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>말랑섬 모바일 프로토타입</title>
<style>
:root{--ink:#24433e;--muted:#6f8d87;--green:#3d9b78;--green2:#28775d;--cream:#fffaf0;--line:rgba(36,67,62,.12);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cdeee7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);touch-action:manipulation}button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}button:focus-visible{outline:3px solid rgba(61,155,120,.35);outline-offset:2px}#app{position:fixed;inset:0;display:flex;justify-content:center;background:linear-gradient(180deg,#dff8f2 0%,#eef9e9 58%,#c5ece5 100%)}.phone{position:relative;width:100%;height:100%;max-width:480px;overflow:hidden;background:#def7f1;isolation:isolate}@media(min-width:640px){#app{padding:18px}.phone{height:min(900px,calc(100vh - 36px));border-radius:34px;box-shadow:0 26px 90px rgba(27,80,70,.22)}}
.sky{position:absolute;inset:0 0 150px;background:radial-gradient(circle at 80% 16%,rgba(255,234,162,.95) 0 38px,rgba(255,234,162,.24) 39px 70px,transparent 71px),radial-gradient(ellipse at 18% 18%,rgba(255,255,255,.9) 0 42px,transparent 43px),linear-gradient(180deg,#dff8f2 0%,#edf9ea 70%,#bfe8df 100%);transition:.45s}.phone.night .sky{background:radial-gradient(circle at 78% 15%,#fff4c8 0 25px,rgba(255,244,200,.14) 26px 57px,transparent 58px),linear-gradient(180deg,#33495e 0%,#526b76 64%,#72958e 100%)}.cloud{position:absolute;width:88px;height:25px;border-radius:999px;background:rgba(255,255,255,.74);animation:drift 26s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:34px;height:34px;left:14px;top:-15px}.cloud:after{width:45px;height:45px;left:39px;top:-22px}.c1{top:110px;left:-65px}.c2{top:188px;left:72%;transform:scale(.72);animation-duration:33s;animation-delay:-14s;opacity:.65}.phone.night .cloud{opacity:.12}@keyframes drift{to{transform:translateX(620px)}}
.header{position:absolute;z-index:30;top:0;left:0;right:0;padding:calc(12px + var(--safeT)) 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:39px;height:39px;border-radius:15px;background:rgba(255,255,255,.82);display:grid;place-items:center;box-shadow:0 8px 18px rgba(38,91,80,.11);font-size:21px}.title{font-size:18px;font-weight:850;letter-spacing:-.05em;line-height:1}.sub{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap}.phone.night .title,.phone.night .sub{color:#fff}.hud{display:flex;gap:7px}.pill{height:38px;border-radius:999px;padding:0 12px;background:rgba(255,255,255,.86);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;box-shadow:0 8px 18px rgba(38,91,80,.1)}
.tip{position:absolute;z-index:25;top:calc(73px + var(--safeT));left:14px;right:14px}.tip-card{max-width:305px;padding:12px 14px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,.91);box-shadow:0 10px 24px rgba(38,91,80,.1);font-size:13px;line-height:1.42;font-weight:650}.tip-card b{display:block;font-size:11px;color:var(--green);margin-bottom:3px}.world{position:absolute;z-index:3;left:0;right:0;top:104px;bottom:144px;overflow:hidden}.sea{position:absolute;left:-12%;right:-12%;bottom:-8%;height:48%;border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(82,186,180,.5),rgba(48,143,143,.72));overflow:hidden}.sea:before,.sea:after{content:"";position:absolute;border:2px solid rgba(255,255,255,.24);border-radius:50%;left:15%;right:15%;height:70px;top:20px}.sea:after{left:4%;right:4%;height:120px;top:52px;opacity:.75}.phone.night .sea{background:linear-gradient(180deg,rgba(68,126,145,.74),rgba(36,80,109,.9))}.island{position:absolute;left:50%;top:55%;width:min(82vw,360px);height:min(47vw,205px);max-width:370px;max-height:210px;transform:translate(-50%,-50%);border-radius:48% 52% 46% 54%/58% 58% 42% 42%;background:linear-gradient(180deg,#83c976 0 64%,#eac272 65% 100%);box-shadow:0 24px 24px rgba(38,92,79,.2),inset 0 8px 0 rgba(255,255,255,.18)}.island:after{content:"";position:absolute;left:10%;right:10%;bottom:-13px;height:26px;border-radius:50%;background:rgba(255,255,255,.16);filter:blur(3px)}
.slot{position:absolute;width:70px;height:58px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:7}.slot:before{content:"";position:absolute;inset:8px;border:2px dashed rgba(34,95,78,.28);border-radius:50%;transition:.2s}.slot.ready:before{border-color:#fff;background:rgba(255,255,255,.25);box-shadow:0 0 0 8px rgba(255,255,255,.08);animation:pulse 1.25s ease-in-out infinite}.slot.filled:before{opacity:0}.s0{left:28%;top:43%}.s1{left:67%;top:40%}.s2{left:43%;top:70%}.s3{left:73%;top:70%}@keyframes pulse{50%{transform:scale(1.12);opacity:.65}}.habitat{font-size:46px;filter:drop-shadow(0 7px 6px rgba(32,74,62,.18));animation:pop .42s cubic-bezier(.2,.9,.3,1.3)}@keyframes pop{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}
.creature{position:absolute;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);z-index:12;filter:drop-shadow(0 7px 7px rgba(32,74,62,.18));animation:arrive .55s cubic-bezier(.18,.88,.25,1.28),bob 2.4s ease-in-out .55s infinite}.blob{position:absolute;inset:8px 6px 5px;border-radius:48% 52% 44% 56%/57% 55% 45% 43%;background:var(--c,#79c9b8);box-shadow:inset 0 7px 0 rgba(255,255,255,.25)}.blob:before,.blob:after{content:"";position:absolute;top:16px;width:5px;height:7px;border-radius:50%;background:#274e48}.blob:before{left:14px}.blob:after{right:14px}.mouth{position:absolute;z-index:2;width:12px;height:6px;left:50%;top:36px;transform:translateX(-50%);border-bottom:2px solid #274e48;border-radius:0 0 10px 10px}.ear{position:absolute;width:18px;height:20px;top:1px;border-radius:70% 30% 50% 50%;background:var(--c,#79c9b8)}.e1{left:4px;transform:rotate(-22deg)}.e2{right:4px;transform:rotate(22deg)}.creature .name{position:absolute;left:50%;top:55px;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:800;color:#315d54;background:rgba(255,255,255,.82);padding:2px 6px;border-radius:999px}.cr0{left:36%;top:48%}.cr1{left:60%;top:44%}.cr2{left:49%;top:65%}.cr3{left:72%;top:62%}.cr4{left:28%;top:65%}.cr5{left:56%;top:34%}@keyframes arrive{from{opacity:0;transform:translate(-50%,-20%) scale(.15)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes bob{50%{margin-top:-5px}}
.toast{position:absolute;z-index:50;left:50%;bottom:158px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:rgba(28,63,57,.92);color:#fff;padding:10px 15px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.tray{position:absolute;z-index:40;left:0;right:0;bottom:0;padding:9px 10px calc(9px + var(--safeB));background:rgba(255,250,240,.95);border-top:1px solid rgba(36,67,62,.08);box-shadow:0 -12px 30px rgba(46,91,80,.11);backdrop-filter:blur(14px)}.tray-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.item{min-width:0;height:73px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.16s}.item:active{transform:scale(.96)}.item.selected{border:2px solid var(--green);background:#effaf5;box-shadow:0 0 0 4px rgba(61,155,120,.1)}.item .ico{font-size:29px;line-height:1}.item .nm{font-size:10px;font-weight:800;white-space:nowrap}.item .cost{font-size:9px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 56px 56px;gap:8px;margin-top:8px}.primary{height:48px;border-radius:16px;background:var(--green);color:#fff;font-weight:850;font-size:14px;box-shadow:0 9px 18px rgba(45,137,104,.24)}.primary:active{transform:scale(.985);background:var(--green2)}.iconbtn{height:48px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:22px;display:grid;place-items:center}.iconbtn:active{transform:scale(.96)}
.sheet{position:absolute;z-index:70;inset:0;background:rgba(26,49,47,.38);display:none;align-items:flex-end;backdrop-filter:blur(4px)}.sheet.open{display:flex}.panel{width:100%;max-height:82%;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:18px 14px calc(18px + var(--safeB));animation:slide .28s ease-out}@keyframes slide{from{transform:translateY(100%)}to{transform:none}}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel h2{margin:0;font-size:21px;letter-spacing:-.05em}.close{width:38px;height:38px;border-radius:50%;background:#fff;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px 6px;text-align:center;min-height:112px}.card .avatar{width:52px;height:52px;margin:0 auto 7px;position:relative}.card.locked{filter:grayscale(1);opacity:.46}.card .cn{font-size:12px;font-weight:850}.card .hint{font-size:9px;color:var(--muted);line-height:1.35;margin-top:4px}.reset{margin-top:16px;width:100%;height:46px;border-radius:15px;background:#f3e6dc;color:#9a5b4b;font-weight:800}.intro{position:absolute;z-index:90;inset:0;background:linear-gradient(180deg,#dff8f2,#f7f2dc);display:grid;place-items:center;padding:26px}.intro.hide{display:none}.intro-box{text-align:center;max-width:340px}.intro-logo{font-size:72px;filter:drop-shadow(0 12px 14px rgba(35,86,73,.18));animation:introBob 2.5s ease-in-out infinite}@keyframes introBob{50%{transform:translateY(-7px) rotate(2deg)}}.intro h1{font-size:34px;margin:10px 0 7px;letter-spacing:-.07em}.intro p{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 22px}.start{width:100%;height:55px;border-radius:18px;background:var(--green);color:#fff;font-size:16px;font-weight:900;box-shadow:0 11px 24px rgba(45,137,104,.24)}@media(max-height:700px){.tip{top:calc(64px + var(--safeT))}.tip-card{padding:9px 12px;font-size:12px}.world{top:86px;bottom:140px}.island{top:57%;width:min(76vw,330px)}.item{height:64px}.actions{margin-top:6px}.primary,.iconbtn{height:43px}.tray{padding-top:7px}.toast{bottom:147px}}
</style>
</head>
<body><div id="app"><main class="phone" id="phone"><div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div></div><header class="header"><div class="brand"><div class="logo">🏝️</div><div><div class="title">말랑섬</div><div class="sub" id="dayLabel">1일째 · 포근한 낮</div></div></div><div class="hud"><div class="pill">✦ <span id="star">4</span></div><div class="pill">♥ <span id="heart">0</span></div></div></header><section class="tip"><div class="tip-card"><b>지금 할 일</b><span id="mission">아래 환경을 고르고 빈 자리를 눌러보세요.</span></div></section><section class="world"><div class="sea"></div><div class="island" id="island"><button class="slot s0" data-slot="0" aria-label="환경 자리 1"></button><button class="slot s1" data-slot="1" aria-label="환경 자리 2"></button><button class="slot s2" data-slot="2" aria-label="환경 자리 3"></button><button class="slot s3" data-slot="3" aria-label="환경 자리 4"></button><div id="creatures"></div></div></section><div class="toast" id="toast"></div><footer class="tray"><div class="tray-row" id="items"></div><div class="actions"><button class="primary" id="nextDay">하루 보내기</button><button class="iconbtn" id="book" aria-label="도감">📖</button><button class="iconbtn" id="mode" aria-label="낮과 밤">☀️</button></div></footer><section class="sheet" id="sheet"><div class="panel"><div class="panel-head"><h2>말랑 도감</h2><button class="close" id="close">×</button></div><div class="grid" id="bookGrid"></div><button class="reset" id="reset">처음부터 다시 시작</button></div></section><section class="intro" id="intro"><div class="intro-box"><div class="intro-logo">🏝️</div><h1>말랑섬</h1><p>작은 환경을 놓으면 낯선 말랑이들이 섬을 찾아옵니다.<br>어떤 조합이 누구를 부를지 발견해보세요.</p><button class="start" id="start">섬으로 들어가기</button></div></section></main></div>
<script>(()=>{const habitats=[{id:'tree',name:'포근나무',icon:'🌳',cost:1},{id:'pond',name:'작은연못',icon:'🫧',cost:1},{id:'flower',name:'별꽃밭',icon:'🌸',cost:1},{id:'cave',name:'조약돌굴',icon:'🪨',cost:1}];const creatures=[{id:'sprout',name:'새싹콩',color:'#80c987',need:['tree'],hint:'나무를 좋아해요'},{id:'drop',name:'물방울이',color:'#72cbd1',need:['pond'],hint:'작은 물소리를 찾아와요'},{id:'petal',name:'꽃솜이',color:'#f2a7bd',need:['flower'],hint:'꽃향기를 따라와요'},{id:'rock',name:'몽돌이',color:'#9aa997',need:['cave'],hint:'조용한 굴을 좋아해요'},{id:'otter',name:'수몽이',color:'#d79a67',need:['tree','pond'],hint:'나무와 연못이 필요해요'},{id:'moon',name:'달토리',color:'#b9a9e8',need:['flower','cave'],night:true,hint:'밤의 꽃밭과 굴을 찾아와요'}];const pos=['cr0','cr1','cr2','cr3','cr4','cr5'];let state={day:1,stars:4,hearts:0,night:false,selected:null,slots:[null,null,null,null],found:[]};try{const saved=JSON.parse(localStorage.getItem('malang-mobile-v1'));if(saved)state={...state,...saved}}catch(e){}const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const save=()=>{try{localStorage.setItem('malang-mobile-v1',JSON.stringify(state))}catch(e){}};function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}function vibrate(ms=20){try{navigator.vibrate?.(ms)}catch(e){}}function renderItems(){$('#items').innerHTML=habitats.map(h=>`<button class="item ${state.selected===h.id?'selected':''}" data-h="${h.id}"><span class="ico">${h.icon}</span><span class="nm">${h.name}</span><span class="cost">✦ ${h.cost}</span></button>`).join('');$$('#items .item').forEach(b=>b.onclick=()=>{state.selected=b.dataset.h;vibrate();render();toast(`${habitats.find(x=>x.id===state.selected).name} 선택`)})}function creatureHTML(c,i){return `<button class="creature ${pos[i]}" data-c="${c.id}" aria-label="${c.name}"><span class="ear e1" style="--c:${c.color}"></span><span class="ear e2" style="--c:${c.color}"></span><span class="blob" style="--c:${c.color}"></span><span class="mouth"></span><span class="name">${c.name}</span></button>`}function discover(){const placed=state.slots.filter(Boolean);let newly=[];creatures.forEach(c=>{const ok=c.need.every(n=>placed.includes(n))&&(!c.night||state.night);if(ok&&!state.found.includes(c.id)){state.found.push(c.id);newly.push(c)}});if(newly.length){state.hearts+=newly.length;toast(`${newly.map(x=>x.name).join(', ')}가 찾아왔어요!`);vibrate(45)}}function render(){$('#star').textContent=state.stars;$('#heart').textContent=state.hearts;$('#phone').classList.toggle('night',state.night);$('#mode').textContent=state.night?'🌙':'☀️';$('#dayLabel').textContent=`${state.day}일째 · ${state.night?'고요한 밤':'포근한 낮'}`;const filled=state.slots.filter(Boolean).length;$('#mission').textContent=filled<4?(state.selected?'반짝이는 빈 자리를 눌러 배치하세요.':'환경을 선택해 섬을 채워보세요.'):(state.found.length<6?'낮과 밤을 바꾸거나 하루를 보내보세요.':'모든 말랑이를 만났어요. 도감을 확인해보세요.');$$('.slot').forEach((el,i)=>{const id=state.slots[i];el.className=`slot s${i} ${id?'filled':state.selected?'ready':''}`;el.innerHTML=id?`<span class="habitat">${habitats.find(h=>h.id===id).icon}</span>`:''});const found=creatures.filter(c=>state.found.includes(c.id));$('#creatures').innerHTML=found.map(creatureHTML).join('');$$('.creature').forEach(b=>b.onclick=()=>{const c=creatures.find(x=>x.id===b.dataset.c);state.hearts++;save();render();toast(`${c.name}: 오늘도 같이 있어요.`);vibrate()});renderItems();save();renderBook()}function renderBook(){$('#bookGrid').innerHTML=creatures.map(c=>{const got=state.found.includes(c.id);return `<div class="card ${got?'':'locked'}"><div class="avatar"><span class="ear e1" style="--c:${got?c.color:'#bbb'}"></span><span class="ear e2" style="--c:${got?c.color:'#bbb'}"></span><span class="blob" style="--c:${got?c.color:'#bbb'}"></span><span class="mouth"></span></div><div class="cn">${got?c.name:'???'}</div><div class="hint">${c.hint}</div></div>`}).join('')}$$('.slot').forEach(el=>el.onclick=()=>{const i=+el.dataset.slot;if(state.slots[i]){toast('이미 환경이 놓여 있어요.');return}if(!state.selected){toast('먼저 아래에서 환경을 골라주세요.');return}const h=habitats.find(x=>x.id===state.selected);if(state.stars<h.cost){toast('별가루가 부족해요. 하루를 보내세요.');return}state.slots[i]=state.selected;state.stars-=h.cost;state.selected=null;discover();render();vibrate(35)});$('#nextDay').onclick=()=>{state.day++;state.stars=Math.min(6,state.stars+2);state.night=!state.night;discover();render();toast(`${state.day}일째가 시작됐어요.`);vibrate(30)};$('#mode').onclick=()=>{state.night=!state.night;discover();render();toast(state.night?'밤이 찾아왔어요.':'햇살이 비쳐요.')};$('#book').onclick=()=>$('#sheet').classList.add('open');$('#close').onclick=()=>$('#sheet').classList.remove('open');$('#sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('open')};$('#reset').onclick=()=>{if(confirm('섬의 진행을 모두 지울까요?')){localStorage.removeItem('malang-mobile-v1');location.reload()}};$('#start').onclick=()=>{$('#intro').classList.add('hide');try{localStorage.setItem('malang-intro','1')}catch(e){}vibrate(30)};try{if(localStorage.getItem('malang-intro'))$('#intro').classList.add('hide')}catch(e){}render()})();</script></body></html>
